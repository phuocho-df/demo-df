# -----------------------------------------------------------------------------
# File:    terraform-ci.yml
# Purpose: Terraform CI — fmt, init, validate, plan + tfsec + checkov scans
# Branch:  all branches
# Last updated: YYYY-MM-DD
# -----------------------------------------------------------------------------

name: Terraform CI

on:
  pull_request:
    paths:
      - 'terraform/**'
  workflow_dispatch:

jobs:
  terraform-ci:
    name: Terraform CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      # Checkout first — version pinned because the version file lives in the repo
      # and cannot be read before the workspace is populated.
      - name: Checkout
        uses: actions/checkout@v4.2.2

      # Only TF_VERSION is loaded dynamically — GitHub Actions does not support
      # ${{ }} expressions in `uses:` fields, so action versions are hardcoded below.
      - name: Read Terraform version
        id: versions
        run: echo "TF_VERSION=$(cat terraform/.terraform-version)" >> $GITHUB_OUTPUT

      - name: Validate required repository variables
        run: |
          missing=()
          [ -z "${{ vars.TF_STATE_BUCKET }}" ]    && missing+=("TF_STATE_BUCKET")
          [ -z "${{ vars.TF_STATE_LOCK_TABLE }}" ] && missing+=("TF_STATE_LOCK_TABLE")
          [ -z "${{ vars.AWS_ACCOUNT_ID }}" ]      && missing+=("AWS_ACCOUNT_ID")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "ERROR: Missing required GitHub repository variables: ${missing[*]}"
            echo "Set them at: Settings → Secrets and variables → Actions → Variables"
            exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.versions.outputs.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.TERRAFORM_ROLE_ARN }}

      - name: Terraform Format
        working-directory: ./terraform
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        working-directory: ./terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="dynamodb_table=${{ vars.TF_STATE_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./terraform
        run: terraform plan -input=false
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_secret_key: ${{ secrets.TF_VAR_SECRET_KEY }}
          TF_VAR_jwt_signing_key: ${{ secrets.TF_VAR_JWT_SIGNING_KEY }}
          TF_VAR_github_token: ${{ secrets.TF_VAR_GITHUB_TOKEN }}
          TF_VAR_bastion_public_key: ${{ secrets.TF_VAR_BASTION_PUBLIC_KEY }}
          TF_VAR_domain_name: ${{ vars.TF_VAR_DOMAIN_NAME }}
          TF_VAR_cors_allowed_origins: ${{ vars.TF_VAR_CORS_ALLOWED_ORIGINS }}
          TF_VAR_github_repo: ${{ vars.TF_VAR_GITHUB_REPO }}
          TF_VAR_certificate_arn: ${{ vars.TF_VAR_CERTIFICATE_ARN }}
          TF_VAR_alarm_email: ${{ vars.TF_VAR_ALARM_EMAIL }}

  tfsec-checks:
    name: Tfsec Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          working_directory: terraform

