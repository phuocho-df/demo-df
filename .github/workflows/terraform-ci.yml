# -----------------------------------------------------------------------------
# File:    terraform-ci.yml
# Purpose: Terraform CI — fmt, init, validate, plan with PR comments + tfsec
# Branch:  master (pull_request target)
# Last updated: YYYY-MM-DD
# -----------------------------------------------------------------------------

name: Running CI

on:
  pull_request:
    branches:
      - master
    paths:
      - 'terraform/**'

jobs:
  terraform-ci:
    name: Terraform CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      # Checkout first — version pinned because the version file lives in the repo
      # and cannot be read before the workspace is populated.
      - name: Checkout
        uses: actions/checkout@v4.2.2

      # Read all other tool versions from files now that the workspace exists
      # Only TF_VERSION is loaded dynamically — GitHub Actions does not support
      # ${{ }} expressions in `uses:` fields, so action versions are hardcoded below.
      - name: Read Terraform version
        id: versions
        run: echo "TF_VERSION=$(cat terraform/.terraform-version)" >> $GITHUB_OUTPUT

      - name: Validate required repository variables
        run: |
          missing=()
          [ -z "${{ vars.TF_STATE_BUCKET }}" ]    && missing+=("TF_STATE_BUCKET")
          [ -z "${{ vars.TF_STATE_LOCK_TABLE }}" ] && missing+=("TF_STATE_LOCK_TABLE")
          [ -z "${{ vars.AWS_ACCOUNT_ID }}" ]      && missing+=("AWS_ACCOUNT_ID")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "ERROR: Missing required GitHub repository variables: ${missing[*]}"
            echo "Set them at: Settings → Secrets and variables → Actions → Variables"
            exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.versions.outputs.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.TERRAFORM_ROLE_ARN }}

      - name: Terraform Format
        id: fmt
        working-directory: ./terraform
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Post Format comment
        uses: digitalfortress-dev/terraform-pr-commenter@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPAND_SUMMARY_DETAILS: true
        with:
          commenter_type: fmt
          commenter_input: ${{ format('{0}{1}', steps.fmt.outputs.stdout, steps.fmt.outputs.stderr) }}
          commenter_exitcode: ${{ steps.fmt.outputs.exitcode }}

      - name: Terraform Init
        id: init
        working-directory: ./terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="dynamodb_table=${{ vars.TF_STATE_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Post Init comment
        uses: digitalfortress-dev/terraform-pr-commenter@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPAND_SUMMARY_DETAILS: true
        with:
          commenter_type: init
          commenter_input: ${{ format('{0}{1}', steps.init.outputs.stdout, steps.init.outputs.stderr) }}
          commenter_exitcode: ${{ steps.init.outputs.exitcode }}

      - name: Terraform Validate
        id: validate
        working-directory: ./terraform
        run: terraform validate

      - name: Post Validate comment
        uses: digitalfortress-dev/terraform-pr-commenter@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPAND_SUMMARY_DETAILS: true
        with:
          commenter_type: validate
          commenter_input: ${{ format('{0}{1}', steps.validate.outputs.stdout, steps.validate.outputs.stderr) }}
          commenter_exitcode: ${{ steps.validate.outputs.exitcode }}

      - name: Terraform Plan
        id: plan
        working-directory: ./terraform
        run: terraform plan
        continue-on-error: true

      - name: Post Plan comment
        uses: digitalfortress-dev/terraform-pr-commenter@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPAND_SUMMARY_DETAILS: true
        with:
          commenter_type: plan
          commenter_input: ${{ format('{0}{1}', steps.plan.outputs.stdout, steps.plan.outputs.stderr) }}
          commenter_exitcode: ${{ steps.plan.outputs.exitcode }}

  tfsec-checks:
    name: Tfsec Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          working_directory: terraform
