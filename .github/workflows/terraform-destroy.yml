# -----------------------------------------------------------------------------
# File:    terraform-destroy.yml
# Purpose: Terraform Destroy — manual teardown with confirmation gate
# Branch:  N/A (workflow_dispatch only — never runs automatically)
# Last updated: YYYY-MM-DD
#
# Safety notes:
#   - This workflow is workflow_dispatch only — it will never run automatically.
#   - Requires explicit confirmation input "destroy" before proceeding.
#   - State is updated in S3 after successful destroy.
# -----------------------------------------------------------------------------

name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: 'Type "destroy" to confirm'
        required: true
        default: ''

jobs:
  destroy:
    name: Running Destroy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    if: github.event.inputs.confirm_destroy == 'destroy'

    steps:
      # Checkout first — version pinned because the version file lives in the repo
      # and cannot be read before the workspace is populated.
      - name: Checkout
        uses: actions/checkout@v4.2.2

      # Read all other tool versions from files now that the workspace exists
      # Only TF_VERSION is loaded dynamically — GitHub Actions does not support
      # ${{ }} expressions in `uses:` fields, so action versions are hardcoded below.
      - name: Read Terraform version
        id: versions
        run: echo "TF_VERSION=$(cat terraform/.terraform-version)" >> $GITHUB_OUTPUT

      - name: Validate required repository variables
        run: |
          missing=()
          [ -z "${{ vars.TF_STATE_BUCKET }}" ]    && missing+=("TF_STATE_BUCKET")
          [ -z "${{ vars.TF_STATE_LOCK_TABLE }}" ] && missing+=("TF_STATE_LOCK_TABLE")
          [ -z "${{ vars.AWS_ACCOUNT_ID }}" ]      && missing+=("AWS_ACCOUNT_ID")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "ERROR: Missing required GitHub repository variables: ${missing[*]}"
            echo "Set them at: Settings → Secrets and variables → Actions → Variables"
            exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.versions.outputs.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.TERRAFORM_ROLE_ARN }}

      - name: Terraform Init
        working-directory: ./terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="dynamodb_table=${{ vars.TF_STATE_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Terraform Plan Destroy
        working-directory: ./terraform
        run: terraform plan -destroy -input=false

      - name: Terraform Destroy
        working-directory: ./terraform
        run: terraform destroy -auto-approve -input=false

  abort-if-unconfirmed:
    name: Abort — confirmation not matched
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm_destroy != 'destroy'

    steps:
      - name: Abort — confirmation not matched
        run: |
          echo "Destroy aborted: input must be exactly 'destroy'"
          exit 1
