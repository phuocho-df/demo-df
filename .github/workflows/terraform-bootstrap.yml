# -----------------------------------------------------------------------------
# File:    terraform-bootstrap.yml
# Purpose: One-time bootstrap — creates S3 state bucket, DynamoDB lock table,
#          and OIDC IAM role so all future runs can use OIDC workflows.
#          Automatically sets GitHub Secrets/Variables via gh CLI — no manual
#          copy-paste, no sensitive values printed to logs.
# Trigger: workflow_dispatch only (manual, never automatic)
#
# HOW TO USE (run once, then delete bootstrap credentials):
#   1. Create an IAM user with AdministratorAccess in AWS Console
#   2. Generate access keys for that user
#   3. Add to GitHub Secrets:
#        AWS_BOOTSTRAP_ACCESS_KEY_ID     → access key ID
#        AWS_BOOTSTRAP_SECRET_ACCESS_KEY → secret access key
#        GH_BOOTSTRAP_TOKEN             → GitHub PAT with repo scope (to set secrets/variables)
#   4. Add required Terraform input secrets/variables (see Terraform Apply step below)
#   5. Run this workflow manually via Actions → Terraform Bootstrap → Run workflow
#   6. Delete the IAM user and the three bootstrap secrets listed above
# -----------------------------------------------------------------------------

name: Terraform Bootstrap

on:
  workflow_dispatch:

jobs:
  bootstrap:
    name: Bootstrap infrastructure
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Read Terraform version
        id: versions
        run: echo "TF_VERSION=$(cat terraform/.terraform-version)" >> $GITHUB_OUTPUT

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.versions.outputs.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials (static — bootstrap only)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          aws-access-key-id: ${{ secrets.AWS_BOOTSTRAP_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_BOOTSTRAP_SECRET_ACCESS_KEY }}

      # Step 1: Create S3 bucket + DynamoDB table (bootstrap uses local state)
      - name: Terraform Init (bootstrap)
        working-directory: ./terraform/bootstrap
        run: terraform init

      - name: Terraform Apply (bootstrap)
        working-directory: ./terraform/bootstrap
        run: terraform apply -auto-approve -input=false

      - name: Read bootstrap outputs
        id: bootstrap
        working-directory: ./terraform/bootstrap
        run: |
          echo "TF_STATE_BUCKET=$(terraform output -raw tf_state_bucket)" >> $GITHUB_OUTPUT
          echo "TF_STATE_LOCK_TABLE=$(terraform output -raw tf_state_lock_table)" >> $GITHUB_OUTPUT

      # Step 2: Apply main terraform — creates OIDC role + full infra
      - name: Terraform Init (main)
        working-directory: ./terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ steps.bootstrap.outputs.TF_STATE_BUCKET }}" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="dynamodb_table=${{ steps.bootstrap.outputs.TF_STATE_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Terraform Apply (main)
        working-directory: ./terraform
        run: terraform apply -auto-approve -input=false
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_secret_key: ${{ secrets.TF_VAR_SECRET_KEY }}
          TF_VAR_jwt_signing_key: ${{ secrets.TF_VAR_JWT_SIGNING_KEY }}
          TF_VAR_github_token: ${{ secrets.TF_VAR_GITHUB_TOKEN }}
          TF_VAR_domain_name: ${{ vars.TF_VAR_DOMAIN_NAME }}
          TF_VAR_github_repo: ${{ vars.TF_VAR_GITHUB_REPO }}
          TF_VAR_certificate_arn: ${{ vars.TF_VAR_CERTIFICATE_ARN }}
          TF_VAR_bastion_public_key: ${{ secrets.TF_VAR_BASTION_PUBLIC_KEY }}

      # Step 3: Auto-set GitHub Secrets/Variables via gh CLI — nothing printed to logs
      - name: Configure GitHub repository secrets and variables
        working-directory: ./terraform
        env:
          GH_TOKEN: ${{ secrets.GH_BOOTSTRAP_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TERRAFORM_ROLE_ARN=$(terraform output -raw github_terraform_role_arn)
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          # Mask values so they never appear in plain text in logs
          echo "::add-mask::$TERRAFORM_ROLE_ARN"
          echo "::add-mask::$AWS_ACCOUNT_ID"

          # Set secret — TERRAFORM_ROLE_ARN is treated as a secret (contains account ID + role name)
          gh secret set TERRAFORM_ROLE_ARN \
            --repo "$GH_REPO" \
            --body "$TERRAFORM_ROLE_ARN"

          # Set variables — non-sensitive config values
          gh variable set AWS_ACCOUNT_ID \
            --repo "$GH_REPO" \
            --body "$AWS_ACCOUNT_ID"

          gh variable set TF_STATE_BUCKET \
            --repo "$GH_REPO" \
            --body "${{ steps.bootstrap.outputs.TF_STATE_BUCKET }}"

          gh variable set TF_STATE_LOCK_TABLE \
            --repo "$GH_REPO" \
            --body "${{ steps.bootstrap.outputs.TF_STATE_LOCK_TABLE }}"

          echo "Bootstrap complete."
          echo "GitHub Secrets set: TERRAFORM_ROLE_ARN"
          echo "GitHub Variables set: AWS_ACCOUNT_ID, TF_STATE_BUCKET, TF_STATE_LOCK_TABLE"
          echo ""
          echo "Next steps:"
          echo "  1. Delete GitHub secrets: AWS_BOOTSTRAP_ACCESS_KEY_ID, AWS_BOOTSTRAP_SECRET_ACCESS_KEY, GH_BOOTSTRAP_TOKEN"
          echo "  2. Delete the IAM user used for bootstrap"
          echo "  3. Future Terraform changes go through terraform-ci/cd workflows"
