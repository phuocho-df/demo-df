# -----------------------------------------------------------------------------
# File:    terraform-bootstrap.yml
# Purpose: One-time bootstrap — creates S3 state bucket, DynamoDB lock table,
#          and OIDC IAM role so CI/CD workflows can authenticate via OIDC.
#          Full infrastructure deployment is handled by terraform-cd.yml.
#          Automatically sets GitHub Secrets/Variables via gh CLI.
# Trigger: workflow_dispatch only (manual, never automatic)
#
# HOW TO USE (run once, then delete bootstrap credentials):
#   1. Create an IAM user with AdministratorAccess in AWS Console
#   2. Generate access keys for that user
#   3. Add to GitHub Secrets:
#        AWS_ACCESS_KEY_ID     → access key ID
#        AWS_SECRET_ACCESS_KEY → secret access key
#        GH_BOOTSTRAP_TOKEN   → GitHub PAT with repo + secrets/variables write scope
#        TF_VAR_GITHUB_TOKEN  → GitHub PAT used by Terraform github provider
#   4. Add to GitHub Variables:
#        TF_VAR_GITHUB_REPO   → e.g. phuocho-df/demo-df
#   5. Run this workflow manually via Actions → Terraform Bootstrap → Run workflow
#   6. Delete the IAM user and the three bootstrap secrets listed above
#   7. Push a terraform change to trigger terraform-cd for full infra deployment
# -----------------------------------------------------------------------------

name: Terraform Bootstrap

on:
  workflow_dispatch:

jobs:
  bootstrap:
    name: Bootstrap prerequisites
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Read Terraform version
        id: versions
        run: echo "TF_VERSION=$(cat terraform/.terraform-version)" >> $GITHUB_OUTPUT

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.versions.outputs.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials (static — bootstrap only)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # Step 1: Create S3 bucket + DynamoDB table for remote state (local state for bootstrap itself)
      - name: Terraform Init (bootstrap)
        working-directory: ./terraform/bootstrap
        run: terraform init

      # Import existing resources into state if they already exist (idempotent re-run).
      # Uses ${VAR:-default} because terraform output exits 0 (not 1) when no outputs exist,
      # so || fallback never fires — shell parameter expansion handles empty strings correctly.
      - name: Import existing bootstrap resources (if any)
        working-directory: ./terraform/bootstrap
        run: |
          BUCKET=$(terraform output -raw tf_state_bucket 2>/dev/null)
          BUCKET=${BUCKET:-django-template-tf-state}
          TABLE=$(terraform output -raw tf_state_lock_table 2>/dev/null)
          TABLE=${TABLE:-django-template-tf-lock}
          terraform import aws_s3_bucket.tf_state "$BUCKET" 2>/dev/null || true
          terraform import aws_dynamodb_table.tf_lock "$TABLE" 2>/dev/null || true

      - name: Terraform Apply (bootstrap)
        working-directory: ./terraform/bootstrap
        run: terraform apply -auto-approve -input=false

      - name: Read bootstrap outputs
        id: bootstrap
        working-directory: ./terraform/bootstrap
        run: |
          echo "TF_STATE_BUCKET=$(terraform output -raw tf_state_bucket)" >> $GITHUB_OUTPUT
          echo "TF_STATE_LOCK_TABLE=$(terraform output -raw tf_state_lock_table)" >> $GITHUB_OUTPUT

      # Step 2: Init main terraform with the remote backend just created
      - name: Terraform Init (main)
        working-directory: ./terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ steps.bootstrap.outputs.TF_STATE_BUCKET }}" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="dynamodb_table=${{ steps.bootstrap.outputs.TF_STATE_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      # Step 3: Create ONLY the OIDC role so CI/CD workflows can authenticate
      # Full infrastructure deployment is handled by terraform-cd.yml
      - name: Terraform Apply (OIDC role only)
        working-directory: ./terraform
        run: |
          terraform apply -auto-approve -input=false \
            -target=module.github_oidc
        env:
          TF_VAR_github_token: ${{ secrets.TF_VAR_GITHUB_TOKEN }}
          TF_VAR_github_repo: ${{ vars.TF_VAR_GITHUB_REPO }}
          # Remaining required vars — placeholder values only for this targeted apply
          # (these resources are NOT created in this step)
          TF_VAR_db_password: placeholder
          TF_VAR_secret_key: placeholder
          TF_VAR_jwt_signing_key: placeholder
          TF_VAR_domain_name: placeholder
          TF_VAR_cors_allowed_origins: placeholder
          TF_VAR_certificate_arn: placeholder
          TF_VAR_bastion_public_key: placeholder

      # Step 4: Auto-set GitHub Secrets/Variables via gh CLI — nothing printed to logs
      - name: Configure GitHub repository secrets and variables
        working-directory: ./terraform
        env:
          GH_TOKEN: ${{ secrets.GH_BOOTSTRAP_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TERRAFORM_ROLE_ARN=$(terraform output -raw github_terraform_role_arn)
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          # Mask values so they never appear in plain text in logs
          echo "::add-mask::$TERRAFORM_ROLE_ARN"
          echo "::add-mask::$AWS_ACCOUNT_ID"

          gh secret set TERRAFORM_ROLE_ARN \
            --repo "$GH_REPO" \
            --body "$TERRAFORM_ROLE_ARN"

          gh variable set AWS_ACCOUNT_ID \
            --repo "$GH_REPO" \
            --body "$AWS_ACCOUNT_ID"

          gh variable set TF_STATE_BUCKET \
            --repo "$GH_REPO" \
            --body "${{ steps.bootstrap.outputs.TF_STATE_BUCKET }}"

          gh variable set TF_STATE_LOCK_TABLE \
            --repo "$GH_REPO" \
            --body "${{ steps.bootstrap.outputs.TF_STATE_LOCK_TABLE }}"

          echo "Bootstrap complete."
          echo "GitHub Secrets set: TERRAFORM_ROLE_ARN"
          echo "GitHub Variables set: AWS_ACCOUNT_ID, TF_STATE_BUCKET, TF_STATE_LOCK_TABLE"
          echo ""
          echo "Next steps:"
          echo "  1. Delete GitHub secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, GH_BOOTSTRAP_TOKEN"
          echo "  2. Delete the IAM user used for bootstrap"
          echo "  3. Push a terraform change to trigger terraform-cd for full infra deployment"
