# -----------------------------------------------------------------------------
# File:    terraform-setup.yml
# Purpose: One-time setup — runs terraform apply with static AWS credentials
#          to create OIDC roles and populate GitHub secrets. After this runs
#          successfully, delete SETUP_AWS_ACCESS_KEY_ID and
#          SETUP_AWS_SECRET_ACCESS_KEY from GitHub secrets.
# Trigger: Manual only (workflow_dispatch)
# -----------------------------------------------------------------------------

name: Terraform setup (run once)

on:
  workflow_dispatch:

env:
  TF_VERSION: "1.7.3"

jobs:
  setup:
    name: Initial Terraform apply
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Uses static credentials — only needed for this first run
      # Delete SETUP_AWS_ACCESS_KEY_ID and SETUP_AWS_SECRET_ACCESS_KEY after success
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          aws-access-key-id: ${{ secrets.SETUP_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.SETUP_AWS_SECRET_ACCESS_KEY }}

      - name: Terraform Init
        working-directory: ./terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ vars.TF_STATE_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply -auto-approve -input=false
