name: Deploy

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'terraform/**'
      - '.github/**'
  # Run after Terraform Deploy when terraform files change alongside code
  workflow_run:
    workflows: ["Terraform Deploy"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

# Required for OIDC token exchange with AWS and artifact download from terraform-cd
permissions:
  id-token: write
  contents: read
  actions: read

concurrency:
  group: cd-master
  cancel-in-progress: false

jobs:
  # Determines whether the deploy job should proceed.
  # When triggered via workflow_run (after terraform-cd), only proceed if terraform-cd
  # uploaded a deploy-signal artifact — meaning non-terraform files also changed.
  check:
    name: Check deploy signal
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
    steps:
      - name: Download deploy signal artifact
        id: download
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: deploy-signal
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
        continue-on-error: true

      - name: Decide whether to deploy
        id: decide
        run: |
          EVENT="${{ github.event_name }}"
          if [ "$EVENT" != "workflow_run" ]; then
            echo "proceed=true" >> $GITHUB_OUTPUT
            echo "Triggered by $EVENT — proceeding"
          elif [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "proceed=false" >> $GITHUB_OUTPUT
            echo "Terraform Deploy did not succeed (conclusion: ${{ github.event.workflow_run.conclusion }}) — skipping"
          elif [ "${{ steps.download.outcome }}" = "success" ]; then
            echo "proceed=true" >> $GITHUB_OUTPUT
            echo "Deploy signal found — code changed alongside terraform — proceeding"
          else
            echo "proceed=false" >> $GITHUB_OUTPUT
            echo "No deploy signal — only terraform changed — skipping"
          fi

  deploy:
    name: Build and deploy to ECS
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.proceed == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          IMAGE_SHA: ${{ vars.ECR_REPOSITORY_URL }}:${{ github.sha }}
        run: |
          docker buildx build \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --tag $IMAGE_SHA \
            --push \
            .
          echo "image=$IMAGE_SHA" >> $GITHUB_OUTPUT

      - name: Download current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ vars.ECS_TASK_FAMILY }} \
            --query taskDefinition > task-def.json

      - name: Render new task definition with updated image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: ${{ vars.ECS_CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy new task definition to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE_NAME }}
          cluster: ${{ vars.ECS_CLUSTER_NAME }}
          wait-for-service-stability: true

      - name: Smoke test
        run: |
          curl --fail --insecure --retry 3 --retry-delay 5 \
            https://${{ vars.TF_VAR_DOMAIN_NAME }}/api/health
